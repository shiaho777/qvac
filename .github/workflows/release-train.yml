name: Release Train (nx)

# Publishes the release train from one branch, in one run.
#
# The train is the six packages that depend on each other in a line:
# @qvac/inference, @qvac/sdk, @qvac/cli, @qvac/ai-sdk-provider and the two
# plugins. It is not the SDK pod's package roster — .github/teams/sdk.json also
# owns registry-server, rag, logging, error and test-suite, which release on
# their own and are untouched here.
#
# The per-package release workflows (publish-inference.yml, publish-sdk.yml,
# trigger-reusable-lib-{cli,ai-sdk-provider,opencode-plugin,openclaw-plugin}.yml)
# stay as they are and still own a single-package release. What they cannot do
# is a coordinated one: each builds in its own run and installs its sibling
# from the registry, so the next package cannot build until the one below it
# is live on npm. That is the wait this replaces.
#
# Here `nx release version` has already written all six versions and every
# dependency range in the release PR, and the build resolves siblings from the
# pnpm workspace, so nothing waits for a registry round-trip. `nx release
# publish` then ships them in project-graph order from a single job, which is a
# single deployment to `environment: npm` and therefore a single approval.
# PyPI is a second job on `environment: pypi`, as it is today.
#
# Branch shape is release-train-<engine-version>: @qvac/inference and @qvac/sdk
# share a major and minor, the branch carries that number, and the agent stack
# moves on its own versions underneath it. The per-package merge guard compares
# one branch version against one package.json, which cannot describe that, so
# this branch is excluded from those workflows and guarded by
# .github/scripts/validate-release-train.mjs instead.

on:
  push:
    branches:
      - release-train-*

  workflow_dispatch:
    inputs:
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string
      publish_pypi_only:
        description: "Skip npm and publish tetherto-qvac-sdk only (npm already shipped)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  release-train-guard:
    name: Release Train Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the release train branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/validate-release-train.mjs "$REF_NAME" "$BEFORE_SHA" "$HEAD_SHA"

  build:
    name: Build the train
    needs:
      - fork-approval
      - authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      # linkWorkspacePackages resolves every @qvac sibling from the workspace,
      # so no hop waits for the one below it to reach npm. That is the whole
      # point of releasing the train in one pass.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: >-
          pnpm exec nx run-many -t build
          --projects=@qvac/inference,@qvac/sdk,@qvac/cli,@qvac/ai-sdk-provider,@qvac/opencode-plugin,@qvac/openclaw-plugin

      - name: Upload train dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-train
          path: |
            packages/inference/dist/
            packages/sdk/dist/
            packages/cli/dist/
            packages/ai-sdk-provider/dist/
            plugins/opencode/dist/
            plugins/openclaw/dist/
          if-no-files-found: error
          retention-days: 30

  build-sdk-python:
    name: Build tetherto-qvac-sdk (Python)
    needs:
      - fork-approval
      - authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -U pip
          .venv/bin/pip install --quiet build twine
          .venv/bin/pip install --quiet -e ".[gen]"

      - name: Contract check
        run: .venv/bin/python3 scripts/generate.py --check

      - name: Build
        run: .venv/bin/python3 -m build --sdist --wheel --outdir dist/

      - name: Verify python version matches @qvac/sdk
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_VER=$(git show "${GITHUB_SHA}":packages/sdk/package.json | jq -r .version)
          PY_VER=$(git show "${GITHUB_SHA}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${GITHUB_SHA}"
            exit 1
          fi
          if [ "$PY_VER" != "$SDK_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs @qvac/sdk@$SDK_VER at ${GITHUB_SHA}. Run packages/sdk-python/scripts/generate.py before release."
            exit 1
          fi
          echo "OK: tetherto-qvac-sdk and @qvac/sdk both at $SDK_VER"

      - name: Check metadata
        run: .venv/bin/twine check dist/*

      - name: Upload python dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-sdk-python
          path: packages/sdk-python/dist/*
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: Publish the train to npm
    needs:
      - fork-approval
      - authorize
      - build
      - release-train-guard
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      needs.build.result == 'success' &&
      needs.release-train-guard.result == 'success' &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          if ! echo "$NPM_TAG_INPUT" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$NPM_TAG_INPUT'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"
          registry-url: https://registry.npmjs.org/
          scope: "@qvac"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download train dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-train

      # One job, so one deployment and one approval. Order comes from
      # `dependsOn: ["^nx-release-publish"]` on each project's publish target,
      # not from a list here. The executor treats an already-published version
      # as success, so a half-shipped run can be re-run.
      - name: Publish the train
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$NPM_TAG_INPUT" ]; then
            pnpm exec nx release publish --tag "$NPM_TAG_INPUT"
          else
            pnpm exec nx release publish
          fi

  publish-pypi:
    name: Publish tetherto-qvac-sdk to PyPI
    needs:
      - fork-approval
      - authorize
      - build-sdk-python
      - release-train-guard
      - publish-npm
    # Publishes after @qvac/sdk reaches npm, at the same version. Escape hatch:
    # workflow_dispatch with publish_pypi_only=true (npm already shipped).
    if: >-
      always() &&
      github.repository == 'tetherto/qvac' &&
      needs.authorize.outputs.allowed == 'true' &&
      needs.build-sdk-python.result == 'success' &&
      (
        (
          needs.release-train-guard.result == 'success' &&
          needs.publish-npm.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_pypi_only == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tetherto-qvac-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-sdk-python
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
